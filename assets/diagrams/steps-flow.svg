  <rect x="252" y="160" width="144" height="64" rx="8" fill="#faf9f5" stroke="#141413" stroke-width="2"/>
  <text x="324" y="184" fill="#6b6a64" font-size="7" text-anchor="middle" class="label">02</text>
  <text x="324" y="208" fill="#141413" font-size="12" text-anchor="middle">步骤二</text>

